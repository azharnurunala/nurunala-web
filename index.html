<link rel="stylesheet" href="styles.css">
<style>
  .home-hero{ max-width:var(--max); margin:0 auto; padding:4rem 1.5rem 2.5rem; border-bottom:0.5px solid var(--faint); }
  .home-hero h1{ font-family:var(--serif); font-size:38px; font-weight:400; line-height:1.25; margin-bottom:1rem; }
  .home-hero p{ font-size:15px; color:var(--muted); line-height:1.7; max-width:480px; font-family:var(--body-serif); font-style:italic; }
  .post-list{ max-width:var(--max); margin:0 auto; padding:0 1.5rem 1rem; }
  .post-item{ display:block; padding:2rem 0; border-bottom:0.5px solid var(--faint); cursor:pointer; text-decoration:none; color:inherit; }
  .post-item:last-child{ border-bottom:none; }
  .post-date{ font-size:11px; color:var(--muted); letter-spacing:.03em; margin-bottom:.6rem; }
  .post-title{ font-family:var(--serif); font-size:22px; font-weight:400; margin-bottom:.5rem; line-height:1.3; }
  .post-item:hover .post-title{ text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line); }
  .post-excerpt{ font-size:14px; color:var(--muted); line-height:1.7; }
  .pagination{ max-width:var(--max); margin:0 auto; padding:1.5rem 1.5rem 2.5rem; display:flex; gap:1.5rem; }
  .page-btn{ font-size:13px; color:var(--muted); cursor:pointer; background:none; border:none; padding:0; font-family:var(--sans); }
  .page-btn:hover{ color:var(--ink); }
  .page-btn.active-pg{ color:var(--ink); font-weight:500; }
  @media(max-width:600px){ .home-hero h1{ font-size:30px; } }
</style>

<main>
  <div class="home-hero">
    <h1>Merapikan Kenangan</h1>
    <p>segala yang fana, abadi dalam aksara</p>
  </div>
  <div class="post-list" id="post-list"></div>
  <div class="pagination" id="pagination"></div>
</main>

<footer class="site-foot">
  <div class="foot-legal">© 2026 Azhar Nurunala</div>
</footer>

<script src="data.js"></script>
<script>
  const PER_PAGE = 10;
  let currentPage = 0;

  function renderPosts(page){
    const start = page*PER_PAGE;
    const slice = allPosts.slice(start, start+PER_PAGE);
    const total = Math.ceil(allPosts.length/PER_PAGE);
    document.getElementById('post-list').innerHTML = slice.map((p,i)=>`
      <a class="post-item" href="baca.html?i=${start+i}">
        <div class="post-date">${p.date}</div>
        <div class="post-title">${p.title}</div>
        <div class="post-excerpt">${p.excerpt}</div>
      </a>`).join('');
    const pg = document.getElementById('pagination');
    pg.innerHTML='';
    if(total>1){
      for(let i=0;i<total;i++){
        const b=document.createElement('button');
        b.className='page-btn'+(i===page?' active-pg':'');
        b.textContent = i===0 ? 'Terbaru' : '← Sebelumnya ('+i+')';
        b.onclick=()=>{ currentPage=i; renderPosts(i); window.scrollTo(0,0); };
        pg.appendChild(b);
      }
    }
  }
  renderPosts(0);
</script>
</body>
